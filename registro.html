
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Registro | Conferencia Magistral</title>

    <link rel="preconnect"
          href="https://fonts.googleapis.com">
    <link rel="preconnect"
          href="https://fonts.gstatic.com"
          crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
          rel="stylesheet">

    <link rel="stylesheet" href="css/estilos.css">
    <link rel="stylesheet" href="css/registro.css">
</head>

<body>

    <header class="navbar">
        <a href="index.html" class="logo">
            CM<span>2027</span>
        </a>

        <nav>
            <a href="index.html">Inicio</a>
            <a href="index.html#informacion">Evento</a>
        </nav>
    </header>

    <main class="registro-pagina">

        <section class="registro-contenedor">

            <div class="registro-encabezado">
                <span class="registro-etiqueta">
                    RESERVA TU LUGAR
                </span>

                <h1>Registro de asistentes</h1>

                <p>
                    Completa tus datos para continuar
                    con la selección de tu asiento.
                </p>
            </div>

            <form id="formRegistro">

                <div class="campo">
                    <label for="nombre">Nombre</label>
                    <input type="text"
                           id="nombre"
                           placeholder="Ingresa tu nombre"
                           maxlength="80"
                           autocomplete="given-name"
                           required>
                </div>

                <div class="campo">
                    <label for="apellidos">Apellidos</label>
                    <input type="text"
                           id="apellidos"
                           placeholder="Ingresa tus apellidos"
                           maxlength="120"
                           autocomplete="family-name"
                           required>
                </div>

                <div class="campo">
                    <label for="correo">
                        Correo electrónico
                    </label>

                    <input type="email"
                           id="correo"
                           placeholder="ejemplo@correo.com"
                           maxlength="254"
                           autocomplete="email"
                           required>
                </div>

                <div class="campo">
                    <label for="telefono">
                        Número de teléfono
                    </label>

                    <input type="tel"
                           id="telefono"
                           placeholder="5512345678"
                           pattern="[0-9]{10}"
                           maxlength="10"
                           inputmode="numeric"
                           autocomplete="tel"
                           required>
                </div>

                <label class="privacidad">
                    <input type="checkbox"
                           id="privacidad"
                           required>

                    <span>
                        Acepto el tratamiento de mis
                        datos personales para gestionar
                        mi registro a la conferencia.
                    </span>
                </label>

                <button type="submit"
                        class="btn-registro">
                    Continuar a selección de asiento
                </button>

                <p id="mensaje" class="mensaje"
                   role="alert"></p>

            </form>

        </section>

    </main>

    <footer>
        <p>
            © 2027 Conferencia Magistral.
            Proyecto académico.
        </p>
    </footer>

    <script src="js/registro.js"></script>

</body>
</html>
